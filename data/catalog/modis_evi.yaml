id: modis_evi
name: {en: Vegetation greenness (EVI), tw: Nnua mu ahabammono}   # Twi to be reviewed
definition:
  kid: {en: How green and leafy the plants are, seen from space.}
  student: {en: "A greenness score measured from space, usually between 0 and 1; higher means more green, healthy leaves. It is called EVI, the Enhanced Vegetation Index."}
  scientist: {en: "Enhanced Vegetation Index (EVI) from MODIS Terra MOD13A3 version 061, layer _1_km_monthly_EVI, as the monthly area mean from a NASA AppEEARS area-statistics export. Like NDVI it compares near-infrared and red reflectance, but it also uses the blue band to reduce haze and soil-background effects, so it keeps responding over dense canopy."}
units: index
source: {collection: MOD13A3, version: "061", variable: _1_km_monthly_EVI, provider: NASA LP DAAC}  # read from the AppEEARS export (data/raw/MOD13A3-061-Statistics.csv), see docs/VERIFIED.md
resolution: {spatial_deg: "~0.01 (1 km)", temporal: monthly}
coverage: {start: 2000-02, end: "<latest>"}
qa: {min_valid_fraction: 0.75, scale_factor: 0.0001}   # AppEEARS area statistics are already scaled
palette_polarity: green_is_green
synonyms: [vegetation, green, greener, plants, trees, forest, crops, farming, deforestation, evi]
typical_questions: ["Is the land getting greener?", "Are forests shrinking here?"]
caveats:
  - January values are missing from the AppEEARS export, so each year has at most 11 months.
  - Clouds can contaminate monthly values in the rainy season.
  - EVI is less prone than NDVI to saturating over dense forest, so it shows change there better, but it is a different index and its values are not NDVI values.
recommended_min_years: 15
model_or_measurement: measurement
