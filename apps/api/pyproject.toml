[project]
name = "edd-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn[standard]", "pydantic>=2", "pyyaml", "numpy", "scipy", "httpx", "anthropic>=2.8"]

[project.optional-dependencies]
# Embedding similarity for POST /variables/search; used only when EMBEDDING_MODEL is also set.
embeddings = ["sentence-transformers"]

[tool.pytest.ini_options]
pythonpath = [".", "../../packages/stats_engine"]
